name: Bug
description: Something that worked as specified and now does not.
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed behaviour, with the exact error message or response if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - local
        - dev
        - prod
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec (Notion, optional)
      description: Link to the spec that defines the correct behaviour, if one exists.

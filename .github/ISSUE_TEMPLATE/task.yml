name: Task / chore
description: Technical work with no new user-facing behaviour (refactor, infra, CI, docs).
title: "[Task] "
labels: ["type: task"]
body:
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: The change and the reason for it.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: Reference (Notion ADR or doc, optional)
